name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            zip unzip

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: |
          # Create licenses directory
          mkdir -p $ANDROID_HOME/licenses 2>/dev/null || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses 2>/dev/null || true

          # Accept all licenses
          LICENSES=(
            "24333f8a63b6825ea9c5514f83c2829b004d1fee"
            "d56f5187479451eabf01fb78af6dfcb131a6481e"
            "84831b9409646a918e30573bab4c9c91346d8abd"
            "e6b7c2ab7fa2298c15165e9583d0222b24b9a170"
          )

          for lic in "${LICENSES[@]}"; do
            echo -e "\n$lic" >> $ANDROID_HOME/licenses/android-sdk-license 2>/dev/null || true
            echo -e "\n$lic" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license 2>/dev/null || true
          done

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -300

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: youtube-subtitles-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn
