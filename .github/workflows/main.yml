name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            zip unzip wget

      - name: Pre-install Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools

          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip

          # Put cmdline-tools in place
          mv cmdline-tools $SDK_DIR/cmdline-tools/latest

          # Create tools/bin with symlinks so buildozer finds sdkmanager
          mkdir -p $SDK_DIR/tools/bin
          for f in $SDK_DIR/cmdline-tools/latest/bin/*; do
            ln -sf "$f" "$SDK_DIR/tools/bin/$(basename $f)"
          done

          # Also copy lib
          mkdir -p $SDK_DIR/tools/lib
          cp -r $SDK_DIR/cmdline-tools/latest/lib/* $SDK_DIR/tools/lib/ 2>/dev/null || true

          # Accept all licenses
          yes | $SDK_DIR/tools/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true

          # Install required components
          yes | $SDK_DIR/tools/bin/sdkmanager --sdk_root=$SDK_DIR \
            "platform-tools" "build-tools;33.0.2" "platforms;android-33"

          # Verify
          echo "sdkmanager:"
          ls -la $SDK_DIR/tools/bin/sdkmanager
          echo "build-tools:"
          ls $SDK_DIR/build-tools/ 2>/dev/null || echo "not found yet (buildozer will install)"

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -500

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: youtube-subtitles-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn
